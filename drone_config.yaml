behaviors:
  DroneBehavior:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 1024           
      buffer_size: 30720         
      learning_rate: 0.0003
      beta: 0.004
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory:                    
        sequence_length: 64      
        memory_size: 256         
    
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.03
        encoding_size: 128
        learning_rate: 0.0003
    
    max_steps: 2000000           
    time_horizon: 256            
    summary_freq: 10000
    keep_checkpoints: 10